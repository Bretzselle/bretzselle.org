---
layout: default
---
<div class="post-wrap">
  <div class="container">
    <header class="post-header">
      <div class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
        {% if page.categories %}
          &nbsp;·&nbsp; {{ page.categories | join: ", " }}
        {% endif %}
      </div>
      <h1>{{ page.title }}</h1>
    </header>
    {% if page.image %}
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" style="border-radius: 12px; margin-bottom: 2rem; width: 100%; max-height: 420px; object-fit: cover;">
    {% endif %}
    <div class="post-body">
      {{ content }}
    </div>
    <footer class="post-footer">
      <a href="{{ '/actualites/' | relative_url }}" class="btn btn-outline">&larr; Toutes les actualités</a>
    </footer>
  </div>
</div>
